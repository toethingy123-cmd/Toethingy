<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f4ef">
<title>Daylight — To-do list</title>
<style>
:root{font:16px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#25251f;background:#f6f4ef;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:56px 18px;background:radial-gradient(ellipse at 50% 0,#fff 0,#f6f4ef 65%)}button,input{font:inherit}button{cursor:pointer}.app{width:min(100%,660px);margin:0 auto}.topline{display:flex;align-items:center;justify-content:space-between;color:#87867f;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase}.brand{font-weight:800;color:#32745d}.date{letter-spacing:0;text-transform:none}.intro{margin:34px 0 24px}.intro h1{font-size:clamp(2.4rem,8vw,3.8rem);line-height:1.04;letter-spacing:-.06em;margin:0 0 9px}.intro p{margin:0;color:#7a7972}.card{background:#fff;border:1px solid #e9e7e1;border-radius:20px;box-shadow:0 18px 55px #3d39200d;overflow:hidden}.form{display:flex;gap:10px;padding:17px;border-bottom:1px solid #eeece7}.form input{min-width:0;flex:1;border:1px solid #e6e4de;border-radius:12px;padding:12px 14px;outline:none;background:#fbfaf8}.form input:focus,.search:focus{border-color:#559a7e;box-shadow:0 0 0 3px #559a7e20}.add{border:0;border-radius:12px;padding:0 18px;background:#34795f;color:white;font-weight:700}.add:hover{background:#28654e}.tools{display:flex;align-items:center;gap:12px;padding:14px 17px;border-bottom:1px solid #eeece7}.filters{display:flex;gap:4px;flex-wrap:wrap}.filter{border:0;background:transparent;color:#77766f;border-radius:8px;padding:7px 10px;font-size:.88rem}.filter[aria-pressed=true]{background:#eaf3ed;color:#28654e;font-weight:700}.search{margin-left:auto;width:min(180px,40%);border:1px solid #e9e7e1;border-radius:9px;padding:8px 10px;outline:none;font-size:.88rem}.task-list{list-style:none;padding:0;margin:0}.task{display:flex;gap:12px;align-items:center;padding:15px 18px;border-bottom:1px solid #f0efeb;animation:appear .18s ease-out}.task:last-child{border-bottom:0}.check{flex:none;appearance:none;width:21px;height:21px;border:1.5px solid #c9c8c0;border-radius:50%;margin:0;cursor:pointer;display:grid;place-items:center}.check:checked{background:#478569;border-color:#478569}.check:checked:after{content:"✓";font-size:13px;font-weight:800;color:white}.task-text{min-width:0;flex:1;overflow-wrap:anywhere}.task.done .task-text{text-decoration:line-through;color:#aaa9a1}.task-date{font-size:.77rem;color:#aaa9a1;white-space:nowrap}.delete{border:0;background:transparent;color:#aaa9a1;font-size:21px;line-height:1;padding:3px 6px;border-radius:6px}.delete:hover{background:#fff0ee;color:#c04c40}.empty{padding:48px 20px;text-align:center;color:#8a8982}.empty-icon{font-size:30px;margin-bottom:8px}.empty strong{display:block;color:#57564f}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 17px;border-top:1px solid #eeece7;color:#88877f;font-size:.84rem}.text-button{border:0;background:none;color:#77766f;padding:5px}.text-button:hover{color:#c04c40}.footer{text-align:center;color:#aaa99f;font-size:.8rem;margin:20px 0}.notice{min-height:1.4em;color:#a3483b;font-size:.82rem;padding:0 18px 8px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes appear{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}@media(max-width:520px){body{padding:30px 12px}.intro{margin:27px 0 20px}.tools{align-items:flex-start;flex-direction:column;gap:8px}.search{margin-left:0;width:100%}.task{padding:14px}.task-date{display:none}.bottom{font-size:.78rem}.form{padding:13px}.add{padding:0 14px}}
</style>
</head>
<body>
<main class="app">
  <div class="topline"><span class="brand">✳ Daylight</span><span class="date" id="today"></span></div>
  <header class="intro"><h1>Make room<br>for what matters.</h1><p>A little progress, one task at a time.</p></header>
  <section class="card" aria-label="To-do list">
    <form class="form" id="taskForm"><label class="sr-only" for="taskInput">Add a task</label><input id="taskInput" maxlength="180" placeholder="What needs doing?" autocomplete="off" required><button class="add" type="submit">＋ Add task</button></form>
    <div class="notice" id="notice" role="status" aria-live="polite"></div>
    <div class="tools"><nav class="filters" aria-label="Filter tasks"><button class="filter" data-filter="all" aria-pressed="true">All</button><button class="filter" data-filter="active" aria-pressed="false">To do</button><button class="filter" data-filter="completed" aria-pressed="false">Completed</button></nav><label class="sr-only" for="search">Search tasks</label><input class="search" id="search" type="search" placeholder="⌕  Search tasks"></div>
    <ul class="task-list" id="taskList" aria-live="polite"></ul>
    <div class="bottom"><span id="remaining">0 tasks left</span><button class="text-button" id="clearCompleted" type="button">Clear completed</button></div>
  </section>
  <p class="footer">Your tasks are saved in this browser on this device.</p>
</main>
<script>
(()=>{'use strict';
const STORAGE_KEY='daylight-todo-tasks-v1';
const form=document.querySelector('#taskForm'),input=document.querySelector('#taskInput'),list=document.querySelector('#taskList'),remaining=document.querySelector('#remaining'),notice=document.querySelector('#notice'),search=document.querySelector('#search');
let tasks=[],filter='all',query='';
const today=new Date();document.querySelector('#today').textContent=today.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
function load(){try{const data=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');if(Array.isArray(data))tasks=data.filter(t=>t&&typeof t.id==='string'&&typeof t.text==='string').map(t=>({id:t.id,text:t.text,done:!!t.done,created:t.created||Date.now()}))}catch(e){notice.textContent='Saved tasks could not be read from this browser.'}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(tasks));notice.textContent=''}catch(e){notice.textContent='Could not save tasks. Your browser storage may be disabled or full.'}}
function render(){list.replaceChildren();const visible=tasks.filter(t=>(filter==='all'||(filter==='active'&&!t.done)||(filter==='completed'&&t.done))&&t.text.toLocaleLowerCase().includes(query));if(!visible.length){const li=document.createElement('li');li.className='empty';li.innerHTML='<div class="empty-icon">☀</div><strong>'+(query?'No matching tasks':'Nothing on your list')+'</strong><span>'+(query?'Try a different search.':'Add a task above to get started.')+'</span>';list.append(li)}else for(const task of visible){const li=document.createElement('li');li.className='task'+(task.done?' done':'');const check=document.createElement('input');check.type='checkbox';check.className='check';check.checked=task.done;check.setAttribute('aria-label',(task.done?'Mark incomplete: ':'Complete: ')+task.text);check.addEventListener('change',()=>{task.done=check.checked;save();render()});const text=document.createElement('span');text.className='task-text';text.textContent=task.text;const date=document.createElement('time');date.className='task-date';date.dateTime=new Date(task.created).toISOString();date.textContent=new Date(task.created).toLocaleDateString(undefined,{month:'short',day:'numeric'});const del=document.createElement('button');del.type='button';del.className='delete';del.textContent='×';del.setAttribute('aria-label','Delete '+task.text);del.addEventListener('click',()=>{tasks=tasks.filter(t=>t.id!==task.id);save();render()});li.append(check,text,date,del);list.append(li)}const left=tasks.filter(t=>!t.done).length;remaining.textContent=left+' task'+(left===1?'':'s')+' left';document.querySelector('#clearCompleted').disabled=!tasks.some(t=>t.done);document.querySelectorAll('.filter').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===filter)))}
form.addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text)return;tasks.unshift({id:globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2),text,done:false,created:Date.now()});input.value='';filter='all';save();render();input.focus()});
document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;render()}));search.addEventListener('input',()=>{query=search.value.trim().toLocaleLowerCase();render()});document.querySelector('#clearCompleted').addEventListener('click',()=>{tasks=tasks.filter(t=>!t.done);save();render()});
load();render();
})();
</script>
</body>
</html>
